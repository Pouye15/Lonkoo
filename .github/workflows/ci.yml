name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # Frontend (Next.js) et serveur temps réel (Node)
  # Les étapes sont ignorées tant que le dossier n'a pas de package.json.
  # ---------------------------------------------------------------
  node:
    name: Node (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [frontend, realtime]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la présence du projet
        id: has
        run: |
          if [ -f package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Pas encore de package.json dans ${{ matrix.dir }} : étapes ignorées."
          fi

      - uses: actions/setup-node@v4
        if: steps.has.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Installer les dépendances
        if: steps.has.outputs.present == 'true'
        run: npm ci

      - name: Lint
        if: steps.has.outputs.present == 'true'
        run: npm run lint --if-present

      - name: Build
        if: steps.has.outputs.present == 'true'
        run: npm run build --if-present

      - name: Tests
        if: steps.has.outputs.present == 'true'
        run: npm test --if-present

  # ---------------------------------------------------------------
  # Backend (Spring Boot)
  # ---------------------------------------------------------------
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la présence du projet
        id: has
        run: |
          if [ -f pom.xml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Pas encore de pom.xml dans backend : étapes ignorées."
          fi

      - uses: actions/setup-java@v4
        if: steps.has.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Le test de chaîne (RealtimeChainIntegrationTest) lance le vrai serveur temps réel Node.
      - uses: actions/setup-node@v4
        if: steps.has.outputs.present == 'true'
        with:
          node-version: 24

      - name: Dépendances du serveur temps réel (test de chaîne)
        if: steps.has.outputs.present == 'true'
        working-directory: realtime
        run: npm ci

      - name: Build et tests
        if: steps.has.outputs.present == 'true'
        run: mvn -B -ntp verify

  # ---------------------------------------------------------------
  # Contrat du canvas : le schéma est valide et les exemples le respectent
  # ---------------------------------------------------------------
  canvas-schema:
    name: Contrat du canvas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valider le schéma et les exemples
        run: |
          python3 -m pip install --quiet jsonschema
          python3 scripts/check_canvas_schema.py

      # Le contrat d'API (docs/openapi.yaml) doit rester une description OpenAPI valide.
      - name: Valider le contrat d'API
        run: |
          python3 -m pip install --quiet openapi-spec-validator
          python3 -m openapi_spec_validator docs/openapi.yaml

  # ---------------------------------------------------------------
  # Licences des composants tiers
  # Le règlement CADev rend le projet irrecevable avec une licence GPL, AGPL ou LGPL.
  # - npm : bloquant. Seules les licences de la liste ci-dessous passent.
  #   Faux positifs possibles (licences doubles) : vérifiez à la main,
  #   puis documentez la décision dans docs/LICENCES-TIERCES.md.
  # - Maven : bloquant pour les dépendances d'exécution (scripts/check_licenses_maven.py) ;
  #   le rapport complet du plugin (test compris) reste informatif.
  # ---------------------------------------------------------------
  licences:
    name: Licences des composants tiers
    runs-on: ubuntu-latest
    env:
      ALLOWED: "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;BlueOak-1.0.0;CC0-1.0;Unlicense;MIT-0;Python-2.0;CC-BY-4.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Licences npm (bloquant)
        run: |
          for dir in frontend realtime; do
            if [ -f "$dir/package-lock.json" ]; then
              echo "== $dir =="
              (cd "$dir" && npm ci --ignore-scripts \
                && npx --yes license-checker-rseidelsohn@5.0.1 --production --excludePrivatePackages --onlyAllow "$ALLOWED")
            else
              echo "== $dir : pas de package-lock.json, ignoré =="
            fi
          done

      - uses: actions/setup-java@v4
        if: hashFiles('backend/pom.xml') != ''
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Bloquant : une licence GPL, AGPL ou LGPL sans alternative permissive rend le projet irrecevable.
      # Les licences sont lues dans les POM des dépendances d'exécution (exceptions documentées dans le script).
      - name: Licences Maven (bloquant)
        if: hashFiles('backend/pom.xml') != ''
        run: |
          (cd backend && mvn -B -ntp dependency:list -DincludeScope=runtime -DoutputFile="$GITHUB_WORKSPACE/maven-deps.txt")
          python3 scripts/check_licenses_maven.py maven-deps.txt

      - name: Licences Maven (rapport complet, informatif)
        continue-on-error: true
        run: |
          if [ -f backend/pom.xml ]; then
            cd backend
            mvn -B -ntp org.codehaus.mojo:license-maven-plugin:2.4.0:add-third-party
            REPORT=target/generated-sources/license/THIRD-PARTY.txt
            if [ -f "$REPORT" ]; then
              echo "== Licences à revoir (GPL, LGPL, EPL, AGPL) =="
              grep -iE "GPL|Lesser General Public|Eclipse Public|\bEPL\b" "$REPORT" || echo "Aucune correspondance."
            fi
          else
            echo "Pas encore de pom.xml dans backend : étape ignorée."
          fi

  # ---------------------------------------------------------------
  # Images Docker : les Dockerfiles se construisent (Docker n'est pas installé sur le poste du backend).
  # L'image du serveur temps réel est en plus démarrée : une route interne sans jeton doit répondre 401.
  # ---------------------------------------------------------------
  docker:
    name: Image Docker (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [backend, realtime]
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la présence du Dockerfile
        id: has
        run: |
          if [ -f "${{ matrix.dir }}/Dockerfile" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Pas de Dockerfile dans ${{ matrix.dir }} : étape ignorée."
          fi

      - name: Construire l'image
        if: steps.has.outputs.present == 'true'
        run: docker build --pull --tag "lonkoo-${{ matrix.dir }}:ci" "${{ matrix.dir }}"

      - name: Démarrer l'image du serveur temps réel
        if: steps.has.outputs.present == 'true' && matrix.dir == 'realtime'
        run: |
          # Secrets jetables, tirés au hasard pour ce seul démarrage.
          docker run --detach --name realtime --publish 1234:1234 \
            --env REALTIME_SERVICE_TOKEN="$(openssl rand -hex 16)" \
            --env REALTIME_TICKET_SECRET="$(openssl rand -hex 32)" \
            lonkoo-realtime:ci
          for attempt in $(seq 1 20); do
            health=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:1234/health || true)
            [ "$health" = "200" ] && break
            sleep 1
          done
          internal=$(curl -s -o /dev/null -w '%{http_code}' \
            http://localhost:1234/internal/canvases/00000000-0000-0000-0000-000000000000/snapshot || true)
          if [ "$health" = "200" ] && [ "$internal" = "401" ]; then exit 0; fi
          echo "Réponses inattendues : /health $health (200 attendu), route interne $internal (401 attendu)"
          docker logs realtime
          exit 1

  # ---------------------------------------------------------------
  # Avis de sécurité connus sur les dépendances (informatif : ne bloque pas la fusion).
  # npm audit pour le front et le temps réel, OSV.dev pour les dépendances Maven d'exécution.
  # ---------------------------------------------------------------
  vulnerabilites:
    name: Avis de sécurité des dépendances (informatif)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: npm audit (frontend)
        if: hashFiles('frontend/package-lock.json') != ''
        continue-on-error: true
        working-directory: frontend
        run: npm audit --omit=dev

      - name: npm audit (temps réel)
        if: hashFiles('realtime/package-lock.json') != ''
        continue-on-error: true
        working-directory: realtime
        run: npm audit --omit=dev

      - uses: actions/setup-java@v4
        if: hashFiles('backend/pom.xml') != ''
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Avis OSV sur les dépendances Maven d'exécution
        if: hashFiles('backend/pom.xml') != ''
        run: |
          (cd backend && mvn -B -ntp dependency:list -DincludeScope=runtime -DoutputFile="$GITHUB_WORKSPACE/deps.txt")
          python3 scripts/check_osv_maven.py deps.txt

  # ---------------------------------------------------------------
  # Détection de secrets dans tout l'historique
  # ---------------------------------------------------------------
  secrets:
    name: Détection de secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer gitleaks
        run: |
          VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks

      - name: Rechercher des secrets
        run: |
          "$RUNNER_TEMP/gitleaks" detect --source . --redact --verbose
