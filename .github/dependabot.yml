# Mises à jour automatiques. Ajouter les blocs npm (frontend, realtime) et maven (backend)
# dès que package.json et pom.xml existent.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint ne supporte pas TypeScript 7 (voir docs/LICENCES-TIERCES.md et le commit du lint).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # eslint-config-next 16 exige ESLint 9 (peers des plugins).
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
