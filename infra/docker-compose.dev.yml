# Environnement de développement local.
# Usage : docker compose -f infra/docker-compose.dev.yml --env-file .env up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lonkoo}
      POSTGRES_USER: ${POSTGRES_USER:-lonkoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définir POSTGRES_PASSWORD dans .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
