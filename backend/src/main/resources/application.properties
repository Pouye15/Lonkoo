spring.application.name=lonkoo-backend

# ----- Serveur HTTP -----
server.port=${SERVER_PORT:8080}
# Derrière Caddy : Tomcat remplace l'adresse distante par celle de X-Forwarded-For (et le schéma par
# X-Forwarded-Proto) quand la requête vient d'un proxy interne (réseau Docker, boucle locale).
# La stratégie « framework » ne le fait pas : tous les visiteurs auraient l'adresse de Caddy et
# partageraient la limite de création d'invités.
server.forward-headers-strategy=native
# Arrêt propre : les requêtes en cours se terminent (20 s au plus) avant la fermeture du serveur.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ----- Session (cookie serveur) -----
# Cookie HttpOnly et SameSite=Lax ; Secure est géré par le profil.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=24h

# ----- Actuator : santé uniquement, exposée sous /api -----
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ----- Erreurs au format application/problem+json (RFC 9457) -----
spring.mvc.problemdetails.enabled=true

# ----- Base de données -----
spring.datasource.url=${DB_URL}
spring.datasource.username=${POSTGRES_USER:lonkoo}
spring.datasource.password=${POSTGRES_PASSWORD}

# ----- Flyway -----
spring.flyway.enabled=true

# ----- Temps réel -----
# Secret de signature des tickets JWT (HS256), délivrés par le backend au navigateur.
realtime.ticket-secret=${REALTIME_TICKET_SECRET}
# Jeton de service : le serveur temps réel l'envoie au backend sur /internal.
realtime.service-token=${REALTIME_SERVICE_TOKEN}
# Adresse du serveur temps réel vue depuis le backend (instantanés, restauration).
realtime.internal-url=${REALTIME_INTERNAL_URL:http://localhost:1234}
# Délai maximal d'un appel au serveur temps réel (secondes) : au-delà, 504.
realtime.request-timeout-seconds=${REALTIME_REQUEST_TIMEOUT_SECONDS:10}

# ----- Application -----
app.public-url=${APP_PUBLIC_URL:http://localhost:3000}

# ----- Connexion GitHub (OAuth) -----
# Portées demandées : read:user et public_repo uniquement. Aucun jeton n'est stocké.
github.oauth.client-id=${GITHUB_OAUTH_CLIENT_ID:change-me}
github.oauth.client-secret=${GITHUB_OAUTH_CLIENT_SECRET:change-me}
github.oauth.redirect-uri=${GITHUB_OAUTH_REDIRECT_URI:http://localhost:3000/api/auth/github/callback}
# Points de terminaison (modifiables en test pour un faux GitHub local).
github.oauth.authorize-url=${GITHUB_OAUTH_AUTHORIZE_URL:https://github.com/login/oauth/authorize}
github.oauth.token-url=${GITHUB_OAUTH_TOKEN_URL:https://github.com/login/oauth/access_token}
github.oauth.user-url=${GITHUB_OAUTH_USER_URL:https://api.github.com/user}
github.oauth.request-timeout-seconds=${GITHUB_OAUTH_REQUEST_TIMEOUT_SECONDS:10}

# ----- Invités éphémères -----
# Durée de vie d'un invité (heures) et nombre maximal d'invités créés par adresse et par heure.
lonkoo.guest-ttl-hours=${GUEST_TTL_HOURS:24}
lonkoo.guest-rate-limit-per-hour=${GUEST_RATE_LIMIT_PER_HOUR:20}