spring.application.name=lonkoo-backend

# ----- Serveur HTTP -----
server.port=${SERVER_PORT:8080}
# Derrière Caddy : Tomcat remplace l'adresse distante par celle de X-Forwarded-For (et le schéma par
# X-Forwarded-Proto) quand la requête vient d'un proxy interne (réseau Docker, boucle locale).
# La stratégie « framework » ne le fait pas : tous les visiteurs auraient l'adresse de Caddy et
# partageraient la limite de création d'invités.
server.forward-headers-strategy=native
# Arrêt propre : les requêtes en cours se terminent (20 s au plus) avant la fermeture du serveur.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ----- Session (cookie serveur, sessions gardées en base) -----
# Cookie HttpOnly et SameSite=Lax ; Secure est géré par le profil.
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Durée d'inactivité d'une session (reprise par Spring Session) ; les sessions échues sont purgées chaque minute.
server.servlet.session.timeout=24h
# Les tables sont créées par Flyway (V13), pas par Spring Session.
spring.session.jdbc.initialize-schema=never

# ----- Agent IA (point de raccordement, WP13) -----
# off (ou tout autre nom sans fournisseur branché) : les routes /ai répondent 501 ; fake : réponses figées de
# démonstration, étiquetées demo ; un vrai fournisseur s'ajoute en implémentant AiClient (docs/ROADMAP-BACKEND.md, § 9).
lonkoo.ai.provider=${AI_PROVIDER:off}
lonkoo.ai.agent-url=${AI_AGENT_URL:http://agent-ia:8000}
lonkoo.ai.service-token=${AI_SERVICE_TOKEN:${REALTIME_SERVICE_TOKEN:}}
lonkoo.ai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
lonkoo.ai.api-key=${AI_API_KEY:}
lonkoo.ai.model=${AI_MODEL:gemini-3.8-flash}
# Délai d'UN appel au modèle (secondes) : utilisé par le client Gemini en direct, et par le microservice agent_ia.
lonkoo.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:30}
# Délai d'attente du backend sur le microservice agent_ia (secondes). Il doit couvrir deux appels au modèle (la
# reprise d'une sortie invalide) plus une marge : AI_AGENT_TIMEOUT_SECONDS >= 2 × AI_TIMEOUT_SECONDS + 5, sinon le
# backend coupe toujours avant la fin et l'appel au modèle est payé pour rien (contrôlé par ConfigurationCheck).
lonkoo.ai.agent-timeout-seconds=${AI_AGENT_TIMEOUT_SECONDS:70}
# Taille maximale du texte saisi (cahier des charges, consigne), en caractères.
lonkoo.ai.max-input-chars=${AI_MAX_INPUT_CHARS:8000}
# Propositions (esquisse, complétion, audit) par jour (UTC) : par personne, par invité (un invité se crée à volonté).
lonkoo.ai.daily-quota=${AI_DAILY_QUOTA:30}
lonkoo.ai.guest-daily-quota=${AI_GUEST_DAILY_QUOTA:5}
# Messages de dialogue (chatbot) par jour (UTC) : compteur séparé, pour qu'une conversation n'épuise pas le quota
# des propositions.
lonkoo.ai.chat-daily-quota=${AI_CHAT_DAILY_QUOTA:60}
lonkoo.ai.chat-guest-daily-quota=${AI_CHAT_GUEST_DAILY_QUOTA:10}
# Plafond de tout le service : la somme des propositions et des messages de dialogue.
lonkoo.ai.global-daily-cap=${AI_GLOBAL_DAILY_CAP:500}

# ----- Actuator : santé uniquement, exposée sous /api -----
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ----- Erreurs au format application/problem+json (RFC 9457) -----
spring.mvc.problemdetails.enabled=true

# ----- Base de données -----
spring.datasource.url=${DB_URL}
spring.datasource.username=${POSTGRES_USER:lonkoo}
spring.datasource.password=${POSTGRES_PASSWORD}

# ----- Flyway -----
spring.flyway.enabled=true

# ----- Temps réel -----
# Secret de signature des tickets JWT (HS256), délivrés par le backend au navigateur.
realtime.ticket-secret=${REALTIME_TICKET_SECRET}
# Jeton de service : le serveur temps réel l'envoie au backend sur /internal.
realtime.service-token=${REALTIME_SERVICE_TOKEN}
# Adresse du serveur temps réel vue depuis le backend (instantanés, restauration).
realtime.internal-url=${REALTIME_INTERNAL_URL:http://localhost:1234}
# Délai maximal d'un appel au serveur temps réel (secondes) : au-delà, 504.
realtime.request-timeout-seconds=${REALTIME_REQUEST_TIMEOUT_SECONDS:10}
# Taille maximale (octets) de l'état d'un canvas que le serveur temps réel peut enregistrer ; au-delà, 413. Dernier filet :
# le serveur temps réel limite déjà ses documents (REALTIME_MAX_STATE_BYTES, 4 Mio, et jamais plus du double). Garder ce
# plafond au-dessus du double du sien. 0 : pas de plafond.
realtime.max-stored-state-bytes=${REALTIME_MAX_STORED_STATE_BYTES:16777216}

# ----- Application -----
app.public-url=${APP_PUBLIC_URL:http://localhost:3000}
# Origines autorisées EN PLUS de l'adresse publique pour les écritures venues d'un navigateur (séparées par des virgules).
# Développement seulement, refusé en profil prod. Dans un Codespace GitHub, le relais du port réécrit l'en-tête Origin en
# https://localhost:3000 : sans cette valeur, créer un projet répond « Origine non autorisée ».
app.extra-allowed-origins=${EXTRA_ALLOWED_ORIGINS:}

# ----- Connexion GitHub (OAuth) -----
# Portées demandées : read:user et public_repo ; avec ?access=deploy (choix explicite), aussi repo et workflow. Aucun jeton n'est stocké.
github.oauth.client-id=${GITHUB_OAUTH_CLIENT_ID:change-me}
github.oauth.client-secret=${GITHUB_OAUTH_CLIENT_SECRET:change-me}
github.oauth.redirect-uri=${GITHUB_OAUTH_REDIRECT_URI:http://localhost:3000/api/auth/github/callback}
# Points de terminaison (modifiables en test pour un faux GitHub local).
github.oauth.authorize-url=${GITHUB_OAUTH_AUTHORIZE_URL:https://github.com/login/oauth/authorize}
github.oauth.token-url=${GITHUB_OAUTH_TOKEN_URL:https://github.com/login/oauth/access_token}
github.oauth.user-url=${GITHUB_OAUTH_USER_URL:https://api.github.com/user}
github.oauth.request-timeout-seconds=${GITHUB_OAUTH_REQUEST_TIMEOUT_SECONDS:10}
# API REST de GitHub (envoi d'un projet généré : création du dépôt, commit). Modifiable en test.
github.api.base-url=${GITHUB_API_BASE_URL:https://api.github.com}
github.api.request-timeout-seconds=${GITHUB_API_REQUEST_TIMEOUT_SECONDS:20}
github.api.retry-delay-millis=${GITHUB_API_RETRY_DELAY_MILLIS:700}

# ----- Invités éphémères -----
# Durée de vie d'un invité (heures) et nombre maximal d'invités créés par adresse et par heure.
lonkoo.guest-ttl-hours=${GUEST_TTL_HOURS:24}
lonkoo.guest-rate-limit-per-hour=${GUEST_RATE_LIMIT_PER_HOUR:20}

# ----- Plafonds d'usage (409 « Limite atteinte » au-delà) -----
# Projets créés par utilisateur (plus bas pour un invité), canvas par projet, versions et liens de partage
# actifs par canvas, taille maximale d'un instantané enregistré (octets).
lonkoo.limits.guest-projects=${MAX_PROJECTS_PER_GUEST:20}
lonkoo.limits.account-projects=${MAX_PROJECTS_PER_ACCOUNT:100}
lonkoo.limits.canvases-per-project=${MAX_CANVASES_PER_PROJECT:10}
lonkoo.limits.versions-per-canvas=${MAX_VERSIONS_PER_CANVAS:50}
lonkoo.limits.share-links-per-canvas=${MAX_SHARE_LINKS_PER_CANVAS:20}
lonkoo.limits.snapshot-max-bytes=${MAX_SNAPSHOT_BYTES:1048576}
# Générations par canvas, taille maximale (octets) d'un projet généré, déploiements par projet généré.
lonkoo.limits.generations-per-canvas=${MAX_GENERATIONS_PER_CANVAS:20}
lonkoo.limits.generated-max-bytes=${MAX_GENERATED_BYTES:8388608}
lonkoo.limits.deployments-per-generation=${MAX_DEPLOYMENTS_PER_GENERATION:20}
# Discussion d'un projet : messages par minute et par personne (429 au-delà, 0 : sans limite), et messages gardés par projet
# (les plus anciens sont élagués, 0 : sans limite).
lonkoo.limits.messages-per-minute=${MAX_MESSAGES_PER_MINUTE:20}
lonkoo.limits.messages-per-project=${MAX_MESSAGES_PER_PROJECT:1000}
# Un travail (génération, envoi sur GitHub, lancement de déploiement) resté « en cours » plus longtemps est marqué échoué.
lonkoo.jobs.stale-minutes=${JOB_STALE_MINUTES:30}
