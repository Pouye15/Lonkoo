# Profil de développement local.
# Activé avec : SPRING_PROFILES_ACTIVE=dev (ou -Dspring-boot.run.profiles=dev)

# Lit le .env de la racine du dépôt (le backend se lance depuis backend/) : sans cela, DB_URL, POSTGRES_PASSWORD et
# les secrets du temps réel n'ont pas de valeur et le démarrage échoue. Les variables d'environnement gardent la
# priorité, et le fichier est facultatif : en production (SPRING_PROFILES_ACTIVE=prod) il n'est jamais lu.
spring.config.import=optional:file:../.env[.properties]

# Journaux plus détaillés pour le développement.
logging.level.com.lonkoo=DEBUG

# Cacher les détails de santé reste raisonnable, même en dev.
management.endpoint.health.show-details=always

# Les cookies de session sont en HttpOnly ; en dev (HTTP local), pas de Secure.
server.servlet.session.cookie.secure=false