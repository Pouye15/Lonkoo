# Profil de développement local.
# Activé avec : SPRING_PROFILES_ACTIVE=dev (ou -Dspring-boot.run.profiles=dev)

# Journaux plus détaillés pour le développement.
logging.level.com.lonkoo=DEBUG

# Cacher les détails de santé reste raisonnable, même en dev.
management.endpoint.health.show-details=always

# Les cookies de session sont en HttpOnly ; en dev (HTTP local), pas de Secure.
server.servlet.session.cookie.secure=false