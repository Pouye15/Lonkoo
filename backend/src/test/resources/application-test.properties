# Profil « test » (activé par @ActiveProfiles dans AbstractPostgresIntegrationTest).
# Il complète le application.properties principal, qui reste chargé : les tests
# s'exécutent donc avec la vraie configuration (cookies, erreurs, actuator…).
realtime.ticket-secret=test-ticket-secret-0123456789abcdef0123456789abcdef
realtime.service-token=test-service-token
realtime.internal-url=http://localhost:1234
app.public-url=http://localhost:3000
# Les tests créent beaucoup d'invités depuis la même adresse (127.0.0.1).
lonkoo.guest-rate-limit-per-hour=1000
