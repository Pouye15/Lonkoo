# Fermeture complète et figée des dépendances d'exécution du microservice : 20 composants,
# directes et transitives. C'est ce fichier qu'installe l'image Docker (`pip install --no-deps`)
# et que lit `scripts/make_sbom.py` : l'image livrée et le SBOM décrivent donc exactement le
# même inventaire, ni plus, ni moins.
#
# Versions : celles contre lesquelles la suite de tests du service a réellement été exécutée,
# à l'exception de `certifi` (magasin de certificats, aucune surface d'API utilisée ici), relevé
# à la version courante — livrer une vieille version reviendrait à livrer des certificats périmés.
# Vérifié : installation `--no-deps` de ce verrou seul dans un environnement vide, puis suite de
# tests complète (65 tests) au vert.
#
# Licence en commentaire de fin de ligne, au format SPDX, **relevée dans le paquet lui-même**
# (expression `License-Expression`, classifieur `License ::` ou champ `License` de la version
# exacte épinglée ici), et non recopiée d'une liste. Reportées dans docs/LICENCES-TIERCES.md § 1.
#
# Pour régénérer après un changement de `requirements.txt` :
#   python -m venv .venv-lock && .venv-lock/bin/pip install -r requirements.txt
#   .venv-lock/bin/pip freeze          # relever les versions, remettre cet en-tête et les licences
# puis vérifier que `pip install --no-deps -r requirements.lock` suffit à faire passer les tests,
# et régénérer le SBOM : python3 scripts/make_sbom.py --only agent_ia
